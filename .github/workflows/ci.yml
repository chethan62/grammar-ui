name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be asked for by hand: a push does not always produce one (measured — a commit
  # landed on main with no run created for it, minutes after three pushes that each produced one),
  # and without this trigger there is no way to ask for the verdict that push should have given.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing to build: every script is python and stdlib, so the gate is the three scripts'
      # own assertions. Each live leg skips itself and says so when it has no engine, no
      # LibreOffice or no display - which is what lets this run in CI at all.
      - name: selection checker
        run: python3 desktop/test-lookup.py
      - name: typing watcher
        run: python3 desktop/test-watch.py
      - name: Qt and QML for the pop-up gate
        # Without this the runner cannot import PySide6, the pop-up's own import guard exits 2 and
        # the gate can only report "0 assertions - passed" - a vacuous green. With it, the clamp,
        # payload and palette assertions genuinely run here.
        #
        # Two things went wrong here first, both now designed out:
        #  * a quiet apt line failing silently and falling through to pip, whose PySide6 wheels do
        #    not ship libEGL, so the import still failed with "libEGL.so.1: cannot open shared
        #    object file";
        #  * the failure surfacing two steps later, in the gate, instead of here.
        # So: apt lines that print what they did, no fallback that hides a failure, and a probe
        # that proves the precondition in the step that owns it.
        run: |
          set -e
          sudo apt-get update -qq
          # The libraries the import needs. Not optional: pip's PySide6 wheels do not ship libEGL,
          # so without these the import fails with "libEGL.so.1: cannot open shared object file".
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
          # Which Qt packaging this runner offers is discovered, not assumed: a guessed name
          # ("python3-pyside6.qml") was not on the runner at all, and that single failed apt line
          # was behind three red runs, because the failure only showed up two steps later.
          PKGS=$(apt-cache search --names-only '^python3-pyside6' | cut -d' ' -f1 | tr '\n' ' ')
          echo "pyside6 packages offered here: ${PKGS:-none}"
          if [ -n "$PKGS" ]; then sudo apt-get install -y $PKGS; fi
          python3 -c "import PySide6" 2>/dev/null \
            || pip install --quiet --break-system-packages PySide6
          python3 -c "import PySide6; print('Qt importable:', PySide6.__version__)"
      - name: caret pop-up placement
        run: python3 desktop/test-popup-place.py
      - name: doctor
        # Safe here with no engine, no watcher unit and no accessibility bus: the test asserts that
        # the doctor *reports* the truth (it is made to fail against a dead engine), not that this
        # machine's chain is healthy.
        run: python3 desktop/test-doctor.py
