name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be asked for by hand: a push does not always produce one (measured — a commit
  # landed on main with no run created for it, minutes after three pushes that each produced one),
  # and without this trigger there is no way to ask for the verdict that push should have given.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing to build: every script is python and stdlib, so the gate is the three scripts'
      # own assertions. Each live leg skips itself and says so when it has no engine, no
      # LibreOffice or no display - which is what lets this run in CI at all.
      - name: selection checker
        run: python3 desktop/test-lookup.py
      - name: typing watcher
        run: python3 desktop/test-watch.py
      - name: Qt and QML for the pop-up gate
        # Without this the runner cannot import PySide6, the pop-up's own import guard exits 2 and
        # the gate can only report "0 assertions - passed" - a vacuous green. With it, the clamp,
        # payload and palette assertions genuinely run here.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyside6.qml \
            || pip install --quiet --break-system-packages PySide6
      - name: caret pop-up placement
        run: python3 desktop/test-popup-place.py
