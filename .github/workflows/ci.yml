name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be asked for by hand: a push does not always produce one (measured — a commit
  # landed on main with no run created for it, minutes after three pushes that each produced one),
  # and without this trigger there is no way to ask for the verdict that push should have given.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # One command, and the same one a person runs. This step used to name three python tests
      # individually, which meant the app's own checks — the fetch timeout, the palette against
      # card_colors(), the endpoints the window calls — never ran here at all, while the badge read
      # green. Running `make test` means this gate cannot check less than the gate at home, and the
      # live legs still skip themselves with a sentence when there is no engine (as they always did).
      - run: make test

  bundle:
    # The app exists to run on Linux and Windows from one source, and the Windows half cannot be
    # proven from Linux — no .msi comes out of this box. What this job proves is that the app COMPILES
    # and BUNDLES on Windows; nothing here launches it, so "builds on Windows" is the claim, and
    # "works on Windows" still needs a person at a Windows machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: app/src-tauri/target/release/bundle/**
          if-no-files-found: error

  e2e:
    # Drives the REAL window: builds the engine (with its harper pair) and the app, then runs the same
    # test-ui.py `make check-ui` runs at home, under Xvfb with an AT-SPI bus — the pieces a desktop
    # provides for free and CI has to stitch. The check job above runs `make test`, whose UI leg skips
    # for exactly this lack of a display; this job exists so the leg has something to bite at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: display and a11y stack
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev xvfb dbus-x11 at-spi2-core python3-pyatspi xdotool
      - name: the engine beside its harper pair
        run: |
          mkdir -p /tmp/engine
          curl -fsSL https://github.com/Automattic/harper/releases/download/v2.12.0/harper-ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp/engine
          curl -fsSL https://github.com/Automattic/harper/releases/download/v2.12.0/harper-cli-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp/engine
          git clone --depth 1 https://github.com/chethan62/grammar-server /tmp/engine/src
          cd /tmp/engine/src && go build -o /tmp/engine/grammar-server ./cmd/server
          ls -la /tmp/engine
      - name: build the window
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --no-bundle
      - name: drive the real window
        run: |
          /tmp/engine/grammar-server &
          ENGINE_PID=$!
          trap "kill $ENGINE_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8875/status >/dev/null && break; sleep 1; done
          ATSPI=$(command -v at-spi-bus-launcher || echo /usr/libexec/at-spi-bus-launcher)
          dbus-run-session -- bash -c "
            export NO_AT_BRIDGE=0
            $ATSPI --launch-immediately &
            # A GTK app enables its accessibility tree only if the registry reports ready before it
            # starts; the suite's own connect does not guarantee that ordering.
            for i in \$(seq 1 20); do
              gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
                --method org.freedesktop.DBus.Properties.Get org.a11y.Status IsEnabled 2>/dev/null \
                | grep -q true && break
              sleep 1
            done
            GRAMMAR_E2E_DEBUG=1 xvfb-run -a -s '-screen 0 1280x800x24' \
              /usr/bin/python3 desktop/test-ui.py --start --binary app/src-tauri/target/release/grammar
          "
