name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No build step, so the whole gate is: the JS parses, and the escaping rule that
      # keeps server text out of the markup still holds.
      - name: app.js parses
        run: node --check app.js
      - name: escaping
        run: node test/esc.test.js
      # The desktop checker's fix logic and its dialog contract. The live section skips
      # itself when no engine is running, which is why this can run in CI at all.
      - name: selection checker
        run: python3 desktop/test-lookup.py
      # The typing watcher. Its live leg needs LibreOffice and at-spi, so in CI it skips
      # itself and says so; the sentence logic and the notification contract still run.
      - name: typing watcher
        run: python3 desktop/test-watch.py
      - name: contrast gate
        # Reads the tokens out of style.css, so a palette edit is checked rather than trusted.
        run: node test/contrast.test.js
      - name: GTK typelib for the pop-up gate
        # Without this the runner has gi but no Gtk typelib, so the pop-up's own import guard
        # exits 2 and the gate can only report "0 assertions - passed". With it, the clamp()
        # assertions genuinely run in CI.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gir1.2-gtk-3.0
      - name: caret pop-up placement
        # The clamp() assertions run anywhere; the live leg needs a display and xdotool and
        # says so when it skips rather than passing quietly.
        run: python3 desktop/test-popup-place.py
