name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No build step, so the whole gate is: the JS parses, and the escaping rule that
      # keeps server text out of the markup still holds.
      - name: app.js parses
        run: node --check app.js
      - name: escaping
        run: node test/esc.test.js
      # The desktop checker's fix logic and its dialog contract. The live section skips
      # itself when no engine is running, which is why this can run in CI at all.
      - name: selection checker
        run: python3 desktop/test-lookup.py
