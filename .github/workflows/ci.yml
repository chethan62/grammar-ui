name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing to build: every script is python and stdlib, so the gate is the three scripts'
      # own assertions. Each live leg skips itself and says so when it has no engine, no
      # LibreOffice or no display - which is what lets this run in CI at all.
      - name: selection checker
        run: python3 desktop/test-lookup.py
      - name: typing watcher
        run: python3 desktop/test-watch.py
      - name: GTK typelib for the pop-up gate
        # Without this the runner has gi but no Gtk typelib, so the pop-up's own import guard
        # exits 2 and the gate can only report "0 assertions - passed". With it, the clamp and
        # payload assertions genuinely run here.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gir1.2-gtk-3.0
      - name: caret pop-up placement
        run: python3 desktop/test-popup-place.py
