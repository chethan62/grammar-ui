<?xml version="1.0" encoding="UTF-8"?>
<!--
  The app icon: a check in a rounded tile, in the green the card uses for "working".

  Chosen to read at 16 px in a menu or a panel, which is where it is actually seen: one shape, one
  colour, no text and no thin lines to disappear. Vector because the desktop asks for 16, 22, 32, 48
  and 64 px and a raster icon would have to be shipped five times. The colour is the product's own
  status green rather than a fresh invention, so the icon and the card's "working" dot read as the
  same thing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#2f9e57"/>
  <path d="M17 33.5 L27.5 44 L47 21" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
