<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Grammar — offline checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <h1><span class="dot"></span>Grammar<span class="tag">&middot; offline</span></h1>
  <div class="apibox">
    <label for="api">API</label>
    <input id="api" spellcheck="false" placeholder="http://localhost:8875">
    <button class="ghost" id="testBtn" onclick="saveApi()">Test</button>
    <span class="ver" id="version"></span>
  </div>
</header>
<!-- The rewrite backend lives on the server (it owns the model call), so this
     panel is its face, not its implementation. Collapsed by default: checking
     text is the job, and choosing a model is something you do once. -->
<details class="aipanel" id="aiPanel">
  <summary><span class="aidot" id="aiDot"></span><span class="aiset">Settings &middot; AI runner</span><span class="aival" id="aiSummary">checking…</span></summary>
  <div class="aibody" id="aiBody"><p class="empty">Loading…</p></div>
</details>
<main>
<div class="pane">
  <label class="pane-head" for="text">Input <span class="stats" id="inputStats">0 ch &middot; 0 w</span></label>
  <div class="pane-body">
    <textarea id="text" aria-label="Text to check" spellcheck="false" placeholder="Write or paste text… live checking as you type" autofocus>She go to the office. teh quick brown fox</textarea>
    <div class="toolbar">
      <select id="lang" title="Dialect"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="en-CA">English (CA)</option><option value="en-AU">English (AU)</option><option value="en-IN">English (IN)</option></select>
      <button class="primary" id="fixAllBtn" onclick="applyAll()" title="Ctrl+Enter">Fix all</button>
      <button class="ghost" id="rephraseBtn" onclick="rephrase()">Rephrase</button>
      <select id="intent" title="How to rephrase">
        <option value="">rephrase as-is</option>
        <option value="concise">more concise</option>
        <option value="clear">clearer</option>
        <option value="simple">simpler</option>
      </select>
      <select id="tone" title="Tone for the rephrase — a small model pads text rather than fixing it, so this is off by default">
        <option value="">no tone change</option>
        <option value="professional">professional</option>
        <option value="casual">casual</option>
        <option value="formal">formal</option>
      </select>
      <label class="check" title="Include style hints (wordiness, passive voice) and not just errors"><!-- style --><input type="checkbox" id="level" checked> style hints</label>
      <button class="ghost" id="copyBtn" onclick="copyText()">Copy text</button>
    </div>
  </div>
</div>
<div class="pane">
  <div class="pane-head">Issues <span class="stats" id="issueStats" aria-live="polite"></span></div>
  <div class="pane-body" id="results"><p class="empty">Checking…</p></div>
</div>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
